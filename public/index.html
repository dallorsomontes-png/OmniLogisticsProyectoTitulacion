
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLogistics | Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      color: #f8fafc;
    }

    .login {
      width: 90%;
      max-width: 400px;
      padding: 38px;
      border-radius: 16px;
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 30px;
      color: #2563eb;
    }

    .logo p {
      color: #64748b;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .mensaje {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="login">

    <div class="logo">
      <h1>OmniLogistics</h1>
      <p>Sistema de Gestión de Inventario</p>
    </div>

    <form id="loginForm">

      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
        placeholder="Ingrese su usuario"
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Ingrese su contraseña"
      >

      <button id="loginButton" type="submit">
        Iniciar sesión
      </button>

    </form>

    <p
      class="mensaje"
      id="mensaje"
      role="status"
      aria-live="polite"
    >
      Acceso exclusivo para usuarios autorizados.
    </p>

  </main>

  <script src="/login.js" defer></script>

</body>
</html>
